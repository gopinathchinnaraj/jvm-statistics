services:

  postgres:
    image: postgres:16-alpine
    container_name: statslab_postgres
    environment:
      POSTGRES_DB: statslab
      POSTGRES_USER: statslab
      POSTGRES_PASSWORD: statslab123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statslab -d statslab"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: statslab_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@statslab.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
